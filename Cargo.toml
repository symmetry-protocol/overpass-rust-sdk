[package]
name = "overpass-rust-sdk"
version = "0.1.0"
edition = "2021"
description = "Rust SDK for the Overpass program — Jupiter Amm impl"
license = "MIT"
repository = "https://github.com/symmetry-protocol/overpass-rust-sdk"

[dependencies]
jupiter-amm-interface = "=0.6.0"
solana-program = "2"
solana-sdk = "2"
anyhow = "1"
rust_decimal = "1"
thiserror = "1"
fixed = "=1.23.1"
uint = "=0.9.5"

[dev-dependencies]
solana-client = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
